
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title></title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stylesheet.css">
     {

      box-sizing: border-box;
    }
</head>
<style>


.logo {
      font-size: clamp(100px, 3vw, 38px);
      letter-spacing: -1px;
      border: 5%;
      padding-top:0%;
      padding-bottom: 0%;
         color: #271b0e;
         text-shadow: 0 0 5px #d79a61, 
                   0 0 20px #d79a61, 
                   0 0 40px #d79a61;
    font-family: Georgia, 'Times New Roman', Times, serif;
}
    body {
      margin: 0;
  background-image: url(https://images.unsplash.com/photo-1581358316909-6d4035624967?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D);
  background-size: contain;
      text-align: center;
      font-family: Verdana, Geneva, Tahoma, sans-serif;  
      font-size: large 100pt;
    }



    .intro {
      padding: 5px 5% 0;
      
      font-size: 19px;
      letter-spacing: 2px;
      line-height: 1.5;
    }

    .intro p {
      margin: 0;
    }

    .gallery {
      position: relative;
      min-height: 690px;
      height: calc(100vh - 190px);
      max-height: 900px;
      min-width: 0;
      overflow: hidden;
      perspective: 1000px;
    }

    .painting {
      position: absolute;
      width: clamp(130px, 18vw, 260px);
      aspect-ratio: 3 / 4;
      padding: 7px;
      background: #60af46;
      border: 1px solid #cfc5b8;

      opacity: 0;
      filter: blur(5px) grayscale(10%);
      transform: rotate(var(--angle, 0deg)) scale(.94);

      transition:
        opacity 2s ease,
        filter 2s ease,
        transform 2s ease,
        box-shadow 2s ease;

      animation: drift var(--duration, 9s) ease-in-out infinite alternate;
      animation-delay: var(--delay, 0s);
      cursor: zoom-in;
      z-index: 1;
    }

    .painting img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .painting:hover,
    .painting:focus-visible {
      opacity: 1;
      filter: blur(0) grayscale(0);
      transform: rotate(0deg) scale(1.06);
      box-shadow: 0 20px 80px #d79a61;
      z-index: 5;
      animation-play-state: paused;
      outline: none;
    }

    .painting .caption {
      position: absolute;
      top: calc(100% + 12px);
      left: 0;
      width: 180px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 1.5s ease, transform 1.5s ease;
      pointer-events: none;
      font-size: 17px;
    }

    .painting:hover .caption,
    .painting:focus-visible .caption {
      opacity: 1;
      transform: translateY(0);
    }


    .p1 {
      left: 9%;
      top: 10%;
      --angle: -5deg;
      --duration: 8s;
    }

    .p2 {
      left: 32%;
      top: 32%;
      width: clamp(115px, 13vw, 190px);
      --angle: 4deg;
      --duration: 11s;
      --delay: -3s;
    }

    .p3 {
      left: 44%;
      top: 20%;
      width: clamp(170px, 21vw, 300px);
      --angle: -2deg;
      --duration: 10s;
      --delay: -2s;
    }

    .p4 {
      left: 67%;
      top: 27%;
      width: clamp(110px, 14vw, 200px);
      --angle: 5deg;
      --duration: 9s;
      --delay: -5s;
    }

    .p5 {
      left: 81%;
      top: 8%;
      width: clamp(130px, 17vw, 245px);
      --angle: -4deg;
      --duration: 12s;
      --delay: -1s;
    }

    @keyframes drift {
      from {
        margin-top: -8px;
      }
      to {
        margin-top: 12px;
      }
    }



    .counter {
      color: #cfc5b8;
      letter-spacing: 2px;
    }

    .caption {
      font-weight: bold;
      border-color: #cfc5b8; fill: #cfc5b8;
      fill-opacity: 50%;
      color: #c67ef2;
        font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif
    
    }

    @media (max-width: 600px) {
      header {
        align-items: flex-start;
        gap: 20px;
        flex-direction: column;
      }


      .p1 { left: 6%; top: 5%; }
      .p2 { left: 52%; top: 22%; }
      .p3 { left: 23%; top: 34%; }
      .p4 { left: 5%; top: 64%; }
      .p5 { left: 56%; top: 68%; }


    }

    @media (prefers-reduced-motion: reduce) {
      .painting {
        animation: none;
        transition-duration: 0.01ms;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo"> Hover to Discover</div>
    <div class="caption"> *Click for affirmation*</div>
    

    
  </header>

  <section class="intro" id="about">
    <p></p>
  </section>

  <main class="gallery" id="gallery">

  

    <article class="painting p1" tabindex="0">
      <a href="Mona1.html"><img src="Images/Mona1.1.jpeg"></a>
      <div class="caption">
      </div>
    </article>


    <article class="painting p2" tabindex="1">
        
     <a href="Mona2.html"><img src="Images/Mona2.1.jpeg"></a>
      <div class="caption">
      </div>
    </article>

    <article class="painting p3" tabindex="2">
        <a href="Mona3.html"><img src="Images/Mona3.1.jpeg"></a>
      <div class="caption">
      </div>
    </article>

    <article class="painting p4" tabindex="3">
        <a href="Mona4.html"><img src="Images/Mona4.1.jpeg"></a>
      <div class="caption">
      </div>
    </article>

    <article class="painting p5" tabindex="4">
        <a href="Mona5.html"><img src="Images/Mona5.1.jpeg"></a>
      <div class="caption">
      </div>
    </article>

  </main>


</body>
</html>
